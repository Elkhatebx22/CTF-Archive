<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Django Unchained</title>
  <style>
    :root { color-scheme: dark; --bg: #0a0f0d; --panel: #101916; --line: #294238; --text: #edf7f1; --muted: #95aa9f; --gold: #c99a3a; --green: #5ec88c; --red: #f87171; }
    * { box-sizing: border-box; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; margin: 0; min-height: 100vh; line-height: 1.45; color: var(--text); background: radial-gradient(circle at top left, #173126, transparent 34rem), var(--bg); }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,15,13,.15), rgba(10,15,13,.9)), url("/brand/banner.png") center top / cover no-repeat; opacity: .28; }
    main { position: relative; z-index: 1; width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 1.25rem 0 3rem; }
    nav { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: .75rem; padding: .8rem max(1rem, calc((100vw - 980px) / 2)); margin-bottom: 1.6rem; background: rgba(7, 12, 10, .78); border-bottom: 1px solid rgba(94, 200, 140, .18); backdrop-filter: blur(12px); }
    nav a { color: var(--text); text-decoration: none; font-size: .94rem; }
    .brand { margin-right: auto; font-weight: 800; letter-spacing: 0; color: var(--green); }
    .brand span { color: var(--gold); }
    h1 { margin: 0 0 .65rem; font-size: clamp(2rem, 5vw, 4.5rem); line-height: .95; }
    h2 { margin: .2rem 0 .5rem; }
    input, textarea { display: block; width: 100%; margin: .35rem 0 1rem; padding: .7rem .75rem; color: var(--text); background: rgba(16,25,22,.86); border: 1px solid var(--line); border-radius: 6px; }
    button, .button { display: inline-block; padding: .62rem .85rem; border: 1px solid rgba(201,154,58,.65); border-radius: 6px; background: linear-gradient(180deg, rgba(201,154,58,.18), rgba(94,200,140,.08)); color: var(--text); text-decoration: none; cursor: pointer; }
    .panel { border: 1px solid rgba(94,200,140,.22); border-radius: 8px; background: rgba(16,25,22,.82); padding: 1rem; margin: 1rem 0; box-shadow: 0 18px 45px rgba(0,0,0,.16); }
    .hero { min-height: 320px; display: grid; align-content: end; padding: 4rem 0 1rem; }
    .hero p { max-width: 42rem; font-size: 1.1rem; }
    .muted { color: var(--muted); }
    .error { color: var(--red); }
    code, pre { background: rgba(5,9,8,.72); color: #d8ffe7; padding: .12rem .3rem; border-radius: 4px; }
    pre { white-space: pre-wrap; padding: .85rem; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">Django <span>Unchained</span></a>
    {% if request.user.is_authenticated %}
      <a href="/projects/new/">New project</a>
      <a href="/notes/new/">Note</a>
      <a href="/logout/">Logout</a>
    {% else %}
      <a href="/register/">Register</a>
      <a href="/login/">Login</a>
    {% endif %}
  </nav>
  <main>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
