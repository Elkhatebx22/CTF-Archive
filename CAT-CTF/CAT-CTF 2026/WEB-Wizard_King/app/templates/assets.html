{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Relic archive</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/assets" enctype="multipart/form-data">
    <label>Relic note
      <input type="file" name="document" required>
    </label>
    <button type="submit">Store relic</button>
  </form>
</div>

<div class="card">
  <h2>Sealed previews</h2>
  {% if files %}
  <table>
    <tr><th>Name</th><th>Preview</th></tr>
    {% for file in files %}
    <tr>
      <td>{{ file }}</td>
      <td><a href="/admin/assets/preview/{{ file|urlencode }}">open</a></td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p class="muted">No relic notes are cached yet.</p>
  {% endif %}
</div>
{% endblock %}
