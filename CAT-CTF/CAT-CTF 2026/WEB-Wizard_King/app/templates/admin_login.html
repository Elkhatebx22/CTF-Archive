{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Wizard King verification</h2>
  <p class="muted">Admin-only route for promoting a verified owner session.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label>Royal mage name
      <input type="text" name="username" autocomplete="off" required>
    </label>
    <label>Royal mana phrase
      <input type="password" name="password" autocomplete="off" required>
    </label>
    <button type="submit">Verify crown</button>
  </form>
</div>
{% if output %}
<div class="card">
  <h2>Verification output</h2>
  <pre>{{ output }}</pre>
</div>
{% endif %}
{% endblock %}
