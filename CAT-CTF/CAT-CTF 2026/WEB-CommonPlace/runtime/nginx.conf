worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /tmp/nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    resolver 127.0.0.11 ipv6=off valid=2s;

    upstream board_backend {
        zone board_backend 64k;
        server board:4000 resolve;
    }

    upstream desk_backend {
        zone desk_backend 64k;
        server desk-api:3000 resolve;
    }

    upstream operations_backend {
        zone operations_backend 64k;
        server operations:13000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 8k;

        location = /operations {
            return 308 /operations/;
        }

        location = /operations/ {
            root /usr/share/nginx/html;
            try_files /operations.html =404;
        }

        location = /operations/app.js {
            root /usr/share/nginx/html;
            try_files /operations.js =404;
        }

        location = /operations/api/proofAssets:ingest {
            if ($request_uri != "/operations/api/proofAssets:ingest") {
                return 404;
            }

            limit_except POST { deny all; }

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_pass http://operations_backend/api/proofAssets:ingest;
        }

        location / {
            proxy_pass http://board_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8081;
        server_name _;

        location = /desk/memo {
            limit_except GET OPTIONS { deny all; }
            proxy_pass http://desk_backend/api/memo;
            proxy_set_header Origin $http_origin;
            proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
            proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
            proxy_set_header Access-Control-Request-Private-Network $http_access_control_request_private_network;
        }

        location / {
            return 404;
        }
    }
}
