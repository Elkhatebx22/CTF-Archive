name: commonplace

services:
  commonplace:
    platform: linux/amd64
    build:
      context: .
      dockerfile: runtime/Dockerfile
    init: true
    environment:
      APP_ENV: production
      APP_KEY: ${OPS_APP_KEY:?set OPS_APP_KEY}
      APP_AES_SECRET_KEY: ${OPS_AES_SECRET_KEY:?set OPS_AES_SECRET_KEY}
      APP_PORT: "13000"
      DB_DIALECT: sqlite
      DB_STORAGE: /app/nocobase/storage/database/commonplace.sqlite
      INIT_APP_LANG: en-US
      INIT_ROOT_EMAIL: root@commonplace.invalid
      INIT_ROOT_PASSWORD: ${OPS_ROOT_PASSWORD:?set OPS_ROOT_PASSWORD}
      INIT_ROOT_NICKNAME: Commonplace Operations
      TZ: Etc/UTC
    ports:
      - "${PUBLIC_PORT:-9090}:8080"
    networks:
      default:
        aliases:
          - board
          - bot
          - desk-api
          - gateway
          - operations
    read_only: true
    mem_limit: "2g"
    cpus: 2.00
    pids_limit: 768
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - seccomp=./bot/chrome-seccomp.json
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run/commonplace:rw,nosuid,nodev,noexec,size=1m
      - /run/commonplace-final:rw,nosuid,nodev,noexec,mode=0700,size=1m
      - /home/node/.nocobase:rw,nosuid,nodev,noexec,uid=1000,gid=1000,mode=0700,size=1m
      - /home/node/.pm2:rw,nosuid,nodev,noexec,uid=1000,gid=1000,mode=0700,size=8m
    shm_size: "512m"
    volumes:
      - instance-data:/app/nocobase/storage
      - review-slots:/run/commonplace-review-slots
    secrets:
      - final-flag
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "x:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/local/bin/commonplace-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 120
      start_period: 10s
    restart: unless-stopped

volumes:
  instance-data:
  review-slots:

secrets:
  final-flag:
    file: ${FINAL_FLAG_FILE:-./flag.txt}
