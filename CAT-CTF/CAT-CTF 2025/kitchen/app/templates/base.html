<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}My Notes App{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 600px;
        }
        header nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #333;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        .error {
            color: red;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 15px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        {% if session.username %}
            <a href="{{ url_for('logout') }}">Logout ({{ session.username }})</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
        {% if session.username %}
            <a href="{{ url_for('edit') }}">Edit My Note</a>
            <a href="{{ url_for('logout') }}">Logout ({{ session.username }})</a>
        {% else %}
  ...
{% endif %}

    </nav>
</header>
<hr />
{% block content %}{% endblock %}
</body>
</html>
